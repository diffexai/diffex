name: Setup Diffex
description: Install the shared CI toolchain and build workspace packages
outputs:
  node-version:
    description: Resolved Node.js version
    value: ${{ steps.node.outputs.node-version }}
runs:
  using: composite
  steps:
    - name: Setup Node.js
      id: node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: npm

    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
        sudo ln -s "$(command -v fdfind)" /usr/local/bin/fd

    - name: Install dependencies
      shell: bash
      run: npm ci --ignore-scripts

    - name: Build
      shell: bash
      run: npm run build
