name: Runtime Image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-image.yml'
      - '.dockerignore'
      - 'Dockerfile.runtime'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/**'
      - 'scripts/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runtime-image.yml'
      - '.dockerignore'
      - 'Dockerfile.runtime'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Phase 1 identity migration hold. Phase 3 validates and re-enables publication.
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.runtime
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/diffexai/diffex-runtime:sha-${{ github.sha }}
          cache-from: type=gha,scope=diffex-runtime
          cache-to: type=gha,mode=max,scope=diffex-runtime
          provenance: mode=max
          sbom: true
