name: Artifact Acceptance

on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Completed publication run to verify through the public registry (empty builds a local candidate)
        type: string
        default: ''
      release_source_commit:
        description: Exact source commit from that publication run
        type: string
        default: ''
      previous_version:
        description: Public predecessor for a real package-manager self-update
        type: string
        default: '0.2.1'

permissions:
  contents: read
  actions: read

concurrency:
  group: artifact-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: ${{ !inputs.release_run_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve candidate commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
      - name: Install pinned npm and locked dependencies
        run: |
          npm install -g npm@11.16.0 --ignore-scripts
          npm ci --ignore-scripts
      - name: Freeze and build reviewed candidate artifacts
        run: |
          npm run hydrate:model-data
          node scripts/release-artifacts.mjs freeze .artifacts/release
          npm run build:offline
          node scripts/release-artifacts.mjs prepare .artifacts/release
      - name: Retain exact private release bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: private-release-${{ steps.source.outputs.commit }}
          path: .artifacts/release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  native-acceptance:
    needs: prepare
    uses: ./.github/workflows/native-artifact-acceptance.yml
    with:
      source_commit: ${{ needs.prepare.outputs.commit }}

  public-acceptance:
    if: ${{ inputs.release_run_id != '' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      RELEASE_SOURCE_COMMIT: ${{ inputs.release_source_commit }}
      PREVIOUS_VERSION: ${{ inputs.previous_version }}
    steps:
      - name: Checkout acceptance tools only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/public-release-acceptance.mjs
            /scripts/release-registry.mjs
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - name: Install pinned npm
        run: npm install -g npm@11.16.0 --ignore-scripts
      - name: Verify publication run and retain its manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          gh api "repos/diffexai/diffex/actions/runs/$RELEASE_RUN_ID" > "$RUNNER_TEMP/publication-run.json"
          jq --exit-status --arg source "$RELEASE_SOURCE_COMMIT" \
            '.path == ".github/workflows/build-binaries.yml" and .event == "push" and .head_sha == $source and .conclusion == "success"' \
            "$RUNNER_TEMP/publication-run.json"
          gh run download "$RELEASE_RUN_ID" --repo diffexai/diffex \
            --name "private-release-$RELEASE_SOURCE_COMMIT" --dir "$RUNNER_TEMP/retained-release"
          mkdir -p .artifacts/public-acceptance
          cp "$RUNNER_TEMP/retained-release/manifest.json" .artifacts/public-acceptance/manifest.json
          jq --exit-status --arg source "$RELEASE_SOURCE_COMMIT" '.source.commit == $source' .artifacts/public-acceptance/manifest.json
          rm -rf "$RUNNER_TEMP/retained-release" .git
      - name: Install and update from the anonymous public registry
        run: node scripts/public-release-acceptance.mjs .artifacts/public-acceptance/manifest.json "$PREVIOUS_VERSION" .artifacts/public-acceptance
      - name: Retain public lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-acceptance-${{ matrix.runner }}-${{ inputs.release_source_commit }}
          path: .artifacts/public-acceptance/
          if-no-files-found: error
          retention-days: 90
