name: Publish Model Catalog
run-name: Model catalog (${{ inputs.environment == 'staging' && 'staging' || 'production' }})

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  pull_request:
    paths:
      - '.github/workflows/publish-model-catalog.yml'
      - '.gitignore'
      - 'package.json'
      - 'packages/ai/**'
      - 'scripts/*model*.mjs'
  # GitHub schedules use UTC. Run hourly candidates across the CET/CEST
  # boundaries; the publish job only uploads at 10:17, 12:17, and 14:17
  # Europe/Vienna time.
  schedule:
    - cron: '17 8-13 * * 1-5'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Commit, branch, or tag to generate from'
        required: false
        default: 'main'
        type: string
      publish:
        description: 'Upload the generated catalog to the selected R2 environment'
        required: true
        default: false
        type: boolean

      environment:
        description: 'Catalog upload environment'
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

jobs:
  generate:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    env:
      SOURCE_REF: ${{ github.event.workflow_run.head_sha || inputs.source_ref || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Resolve source SHA
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate model catalog JSON
        env:
          MODEL_CATALOG_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: npm run generate:model-catalog

      - name: Validate model catalog JSON
        run: npm run check:model-catalog

      - name: Upload model catalog JSON
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model-catalog-json
          path: .artifacts/model-catalog
          if-no-files-found: error
          retention-days: 14

  publish:
    if: ${{ github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish && inputs.source_ref == 'main')) }}
    needs: generate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'staging' && 'diffex-model-upload-staging' || 'diffex-model-upload-production' }}
    concurrency:
      group: publish-model-catalog-${{ inputs.environment == 'staging' && 'staging' || 'production' }}
      cancel-in-progress: false
    env:
      SOURCE_REF: ${{ needs.generate.outputs.source_sha }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: 'true'
      CATALOG_BUCKET: ${{ inputs.environment == 'staging' && 'diffex-artifacts-staging' || 'diffex-artifacts' }}
      R2_ENDPOINT: https://6b24afa849f8254ab5e6e2d1956239cc.r2.cloudflarestorage.com
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Download model catalog JSON
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: model-catalog-json
          path: .artifacts/model-catalog

      - name: Verify AWS CLI
        run: aws --version

      - name: Check publication window
        id: publication-window
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish || false }}
        run: node scripts/model-publication-window.mjs >> "$GITHUB_OUTPUT"

      - name: Publish model catalog to R2
        if: steps.publication-window.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.DIFFEX_ARTIFACTS_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DIFFEX_ARTIFACTS_R2_SECRET_ACCESS_KEY }}
        run: |
          node scripts/publish-model-catalog.mjs \
            --input .artifacts/model-catalog \
            --bucket "$CATALOG_BUCKET" \
            --endpoint "$R2_ENDPOINT" \
            --source-commit "$SOURCE_REF" \
            --require-main
