name: Verify Release Publication

on:
  workflow_dispatch:
    inputs:
      check_public_api:
        description: Verify the deployed staging public API against release fixtures
        type: boolean
        default: false

      check_client_canaries:
        description: Verify isolated source CLI startup and self-update against staging
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-release-publication-staging
  cancel-in-progress: false

jobs:
  production-credential-scope:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: diffex-release-upload
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
      - name: Verify production publisher bucket isolation without writes
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DIFFEX_ARTIFACTS_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DIFFEX_ARTIFACTS_R2_SECRET_ACCESS_KEY }}
        run: node scripts/verify-release-credentials.mjs --production

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: diffex-release-staging
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
      - name: Install canary dependencies without lifecycle scripts
        if: inputs.check_client_canaries
        run: npm ci --ignore-scripts
      - name: Prepare and verify source CLI startup
        if: inputs.check_client_canaries
        env:
          DIFFEX_OFFLINE: '1'
          DIFFEX_NO_LOCAL_LLM: '1'
        run: |
          npm run hydrate:model-data
          npm run check:model-data
          node --import=tsx packages/coding-agent/src/cli.ts --version
      - name: Verify AWS CLI
        run: aws --version
      - name: Verify staging publisher bucket isolation
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DIFFEX_ARTIFACTS_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DIFFEX_ARTIFACTS_R2_SECRET_ACCESS_KEY }}
        run: node scripts/verify-release-credentials.mjs --staging
      - name: Check controlled publisher regressions
        run: node --test scripts/publish-release-announcement.test.mjs
      - name: Verify publication against staging storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DIFFEX_ARTIFACTS_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DIFFEX_ARTIFACTS_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: 'true'
          CHECK_PUBLIC_API: ${{ inputs.check_public_api }}
          CHECK_CLIENT_CANARIES: ${{ inputs.check_client_canaries }}
        run: |
          if [ "$CHECK_CLIENT_CANARIES" = "true" ]; then
            node scripts/verify-release-publication.mjs --staging --client-canaries
          elif [ "$CHECK_PUBLIC_API" = "true" ]; then
            node scripts/verify-release-publication.mjs --staging --public-api
          else
            node scripts/verify-release-publication.mjs --staging
          fi
