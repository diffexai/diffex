name: Daytona Behaviors

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  DIFFEX_SOURCE_COMMIT: ${{ github.sha }}

jobs:
  prepare:
    # Dispatch remains available for qualification; pushes spend nothing until approved.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.DAYTONA_BEHAVIORS_QUALIFIED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
      - name: Install pinned npm and locked dependencies
        run: |
          npm install -g npm@11.16.0 --ignore-scripts
          npm ci --ignore-scripts
      - name: Freeze, build offline, prepare and verify exact candidate bytes
        run: |
          npm run hydrate:model-data
          node scripts/release-artifacts.mjs freeze .artifacts/release
          npm run build:offline
          node scripts/release-artifacts.mjs prepare .artifacts/release
          node scripts/release-artifacts.mjs verify .artifacts/release
          git diff --exit-code HEAD
      - name: Test behavior harness and failure-path orchestration without credentials
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m venv "$RUNNER_TEMP/behavior-test-venv"
          "$RUNNER_TEMP/behavior-test-venv/bin/python" -m pip install -r scripts/daytona-behaviors/requirements.txt
          "$RUNNER_TEMP/behavior-test-venv/bin/python" -m unittest discover -s scripts/daytona-behaviors -p 'test_*.py'
          node --test scripts/artifact-acceptance.test.mjs scripts/daytona-behaviors-workflow.test.mjs scripts/daytona-behaviors/fixture.test.mjs scripts/daytona-behaviors/live-guard.test.mjs
      - name: Bundle checked behavior harness without rebuilding the candidate
        run: |
          mkdir -p .artifacts/daytona-bundle
          tar -czf .artifacts/daytona-bundle/bundle.tar.gz \
            scripts/artifact-installation.mjs \
            scripts/verify-candidate-artifacts.py \
            scripts/fixtures/artifact-handoff.mjs \
            scripts/daytona-behaviors/installed.py \
            scripts/daytona-behaviors/install.mjs \
            scripts/daytona-behaviors/fixture.mjs \
            scripts/daytona-behaviors/live-guard.mjs \
            scripts/daytona-behaviors/baselines
          sha256sum .artifacts/daytona-bundle/bundle.tar.gz > .artifacts/daytona-bundle/SHA256SUMS
      - name: Retain exact candidate bytes (not confidential)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daytona-release-${{ github.sha }}-${{ github.run_attempt }}
          path: .artifacts/release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Retain exact behavior bundle (not confidential)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daytona-bundle-${{ github.sha }}-${{ github.run_attempt }}
          path: .artifacts/daytona-bundle/
          if-no-files-found: error
          retention-days: 30

  deterministic:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: daytona-behaviors
    env:
      DAYTONA_BEHAVIOR_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-deterministic
      DAYTONA_SNAPSHOT: ${{ vars.DAYTONA_BEHAVIORS_SNAPSHOT }}
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node for artifact verification only
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
      - name: Install pinned Daytona SDK in an isolated environment
        run: |
          python3 -m venv "$RUNNER_TEMP/daytona-venv"
          "$RUNNER_TEMP/daytona-venv/bin/python" -m pip install -r scripts/daytona-behaviors/requirements.txt
      - name: Download exact candidate bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: daytona-release-${{ github.sha }}-${{ github.run_attempt }}
          path: .artifacts/release
      - name: Download exact behavior bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: daytona-bundle-${{ github.sha }}-${{ github.run_attempt }}
          path: .artifacts/daytona-bundle
      - name: Verify retained source, tarballs and harness bytes
        run: |
          node scripts/release-artifacts.mjs verify .artifacts/release
          sha256sum -c .artifacts/daytona-bundle/SHA256SUMS
          test -n "$DAYTONA_SNAPSHOT"
      - name: Run deterministic installed-artifact behaviors in Daytona
        id: run
        timeout-minutes: 25
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        run: |
          "$RUNNER_TEMP/daytona-venv/bin/python" scripts/daytona-behaviors/daytona_runner.py run \
            --artifacts .artifacts/release --bundle .artifacts/daytona-bundle/bundle.tar.gz \
            --snapshot "$DAYTONA_SNAPSHOT" --output .artifacts/daytona-deterministic \
            --mode deterministic --commit "$DIFFEX_SOURCE_COMMIT" --run-id "$DAYTONA_BEHAVIOR_RUN_ID" \
            --timeout-seconds 1200
      - name: Recover evidence and confirm sandbox cleanup without relaunching
        id: recover
        if: ${{ always() && steps.run.outcome != 'skipped' }}
        timeout-minutes: 5
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        run: |
          "$RUNNER_TEMP/daytona-venv/bin/python" scripts/daytona-behaviors/daytona_runner.py recover \
            --output .artifacts/daytona-deterministic
      - name: Record execution and cleanup outcomes
        if: always()
        env:
          EXECUTION: ${{ steps.run.outcome }}
          RECOVERY: ${{ steps.recover.outcome }}
        run: |
          mkdir -p .artifacts/daytona-deterministic
          jq -n --arg commit "$DIFFEX_SOURCE_COMMIT" --arg runId "$DAYTONA_BEHAVIOR_RUN_ID" \
            --arg mode deterministic --arg execution "$EXECUTION" --arg recovery "$RECOVERY" \
            '{commit: $commit, runId: $runId, mode: $mode, execution: $execution, recovery: $recovery}' \
            > .artifacts/daytona-deterministic/workflow-job.json
      - name: Guard all deterministic evidence before publication
        id: sanitize
        if: always()
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        run: |
          python3 scripts/daytona-behaviors/sanitize_evidence.py \
            --root .artifacts/daytona-deterministic --output .artifacts/daytona-deterministic-sanitized \
            --mode deterministic
      - name: Retain sanitized deterministic evidence even on failure
        if: ${{ always() && steps.sanitize.outputs.safe_to_upload == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daytona-evidence-deterministic-${{ github.sha }}-${{ github.run_attempt }}
          path: .artifacts/daytona-deterministic-sanitized/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  live:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: daytona-behaviors
    env:
      DAYTONA_BEHAVIOR_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-live
      DAYTONA_SNAPSHOT: ${{ vars.DAYTONA_BEHAVIORS_SNAPSHOT }}
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node for artifact verification only
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
      - name: Install pinned Daytona SDK in an isolated environment
        run: |
          python3 -m venv "$RUNNER_TEMP/daytona-venv"
          "$RUNNER_TEMP/daytona-venv/bin/python" -m pip install -r scripts/daytona-behaviors/requirements.txt
      - name: Download exact candidate bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: daytona-release-${{ github.sha }}-${{ github.run_attempt }}
          path: .artifacts/release
      - name: Download exact behavior bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: daytona-bundle-${{ github.sha }}-${{ github.run_attempt }}
          path: .artifacts/daytona-bundle
      - name: Verify retained source, tarballs and harness bytes
        run: |
          node scripts/release-artifacts.mjs verify .artifacts/release
          sha256sum -c .artifacts/daytona-bundle/SHA256SUMS
          test -n "$DAYTONA_SNAPSHOT"
      - name: Run bounded live installed-artifact behaviors in Daytona
        id: run
        timeout-minutes: 25
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          "$RUNNER_TEMP/daytona-venv/bin/python" scripts/daytona-behaviors/daytona_runner.py run \
            --artifacts .artifacts/release --bundle .artifacts/daytona-bundle/bundle.tar.gz \
            --snapshot "$DAYTONA_SNAPSHOT" --output .artifacts/daytona-live \
            --mode live --commit "$DIFFEX_SOURCE_COMMIT" --run-id "$DAYTONA_BEHAVIOR_RUN_ID" \
            --timeout-seconds 1200
      - name: Recover evidence and confirm sandbox cleanup without relaunching
        id: recover
        if: ${{ always() && steps.run.outcome != 'skipped' }}
        timeout-minutes: 5
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        run: |
          "$RUNNER_TEMP/daytona-venv/bin/python" scripts/daytona-behaviors/daytona_runner.py recover \
            --output .artifacts/daytona-live
      - name: Record execution and cleanup outcomes
        if: always()
        env:
          EXECUTION: ${{ steps.run.outcome }}
          RECOVERY: ${{ steps.recover.outcome }}
        run: |
          mkdir -p .artifacts/daytona-live
          jq -n --arg commit "$DIFFEX_SOURCE_COMMIT" --arg runId "$DAYTONA_BEHAVIOR_RUN_ID" \
            --arg mode live --arg execution "$EXECUTION" --arg recovery "$RECOVERY" \
            '{commit: $commit, runId: $runId, mode: $mode, execution: $execution, recovery: $recovery}' \
            > .artifacts/daytona-live/workflow-job.json
      - name: Guard all live evidence before publication
        id: sanitize
        if: always()
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 scripts/daytona-behaviors/sanitize_evidence.py \
            --root .artifacts/daytona-live --output .artifacts/daytona-live-sanitized \
            --mode live
      - name: Retain sanitized live evidence even on failure
        if: ${{ always() && steps.sanitize.outputs.safe_to_upload == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daytona-evidence-live-${{ github.sha }}-${{ github.run_attempt }}
          path: .artifacts/daytona-live-sanitized/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  daytona-behaviors:
    needs: [prepare, deterministic, live]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || vars.DAYTONA_BEHAVIORS_QUALIFIED == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PREPARE_RESULT: ${{ needs.prepare.result }}
      DETERMINISTIC_RESULT: ${{ needs.deterministic.result }}
      LIVE_RESULT: ${{ needs.live.result }}
    steps:
      - name: Aggregate both modes, missing evidence and cleanup failures
        run: |
          mkdir -p .artifacts/daytona-summary
          failed=0
          for result in "$PREPARE_RESULT" "$DETERMINISTIC_RESULT" "$LIVE_RESULT"; do
            if [[ "$result" != success ]]; then failed=1; fi
          done
          for mode in deterministic live; do
            evidence=".artifacts/daytona-summary/$mode"
            if ! gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "daytona-evidence-$mode-$DIFFEX_SOURCE_COMMIT-$GITHUB_RUN_ATTEMPT" --dir "$evidence"; then
              echo "::error::Missing $mode evidence artifact"
              failed=1
              continue
            fi
            if ! jq --exit-status --arg mode "$mode" \
              '.schemaVersion == 1 and .mode == $mode and .safe_to_upload == true and .outcome == "clean" and .credential_matches == 0' \
              "$evidence/publication-safety.json" > /dev/null; then
              echo "::error::Missing or failed $mode credential publication guard"
              failed=1
            fi
            if ! jq --exit-status --arg commit "$DIFFEX_SOURCE_COMMIT" --arg mode "$mode" \
              --arg runId "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$mode" \
              '.commit == $commit and .mode == $mode and .runId == $runId and .execution == "success" and .recovery == "success"' \
              "$evidence/workflow-job.json" > /dev/null; then
              echo "::error::$mode execution or cleanup did not succeed"
              failed=1
            fi
            if ! jq --exit-status --arg commit "$DIFFEX_SOURCE_COMMIT" --arg mode "$mode" \
              --arg runId "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$mode" \
              '.commit == $commit and .mode == $mode and .run_id == $runId and .outcome == "passed" and .execution == "passed" and .exit_code == 0 and .installed_outcome == "passed" and .reports_complete == true and .cleanup == "confirmed"' \
              "$evidence/orchestration.json" > /dev/null; then
              echo "::error::Missing, incomplete or failed $mode orchestration/cleanup result"
              failed=1
            fi
            if [[ "$mode" == deterministic ]]; then
              expected='["artifact-integrity","npm-package-integrity","bun-package-integrity","npm-installation","npm-print","npm-builtin-auth-transport","npm-terminal-tools-cancel-resume","npm-artifact-terminal","bun-installation","bun-print","bun-builtin-auth-transport","bun-terminal-tools-cancel-resume","bun-artifact-terminal"]'
            else
              expected='["artifact-integrity","npm-package-integrity","npm-live-openai"]'
            fi
            if ! jq --exit-status --arg commit "$DIFFEX_SOURCE_COMMIT" --arg mode "$mode" --argjson expected "$expected" \
              '.schemaVersion == 1 and .commit == $commit and .mode == $mode and .outcome == "passed" and (.artifactHashes | type == "object" and length > 0) and ((.scenarios | map(.id) | sort) == ($expected | sort)) and all(.scenarios[]; .commit == $commit and .outcome == "passed")' \
              "$evidence/evidence/results.json" > /dev/null; then
              echo "::error::Missing, incomplete or failed $mode installed scenarios"
              failed=1
            fi
            for result in orchestration.xml evidence/results.xml; do
              if [[ ! -s "$evidence/$result" ]]; then
                echo "::error::Missing $mode $result"
                failed=1
              fi
            done
          done
          if ! jq --slurp --exit-status '.[0].artifactHashes == .[1].artifactHashes' \
            .artifacts/daytona-summary/deterministic/evidence/results.json \
            .artifacts/daytona-summary/live/evidence/results.json > /dev/null; then
            echo '::error::Both modes must test the same candidate tarball hashes'
            failed=1
          fi
          jq -n --arg commit "$DIFFEX_SOURCE_COMMIT" --arg prepare "$PREPARE_RESULT" \
            --arg deterministic "$DETERMINISTIC_RESULT" --arg live "$LIVE_RESULT" --argjson failed "$failed" \
            '{commit: $commit, jobs: {prepare: $prepare, deterministic: $deterministic, live: $live}, passed: ($failed == 0)}' \
            > .artifacts/daytona-summary/summary.json
          {
            echo '## Daytona installed-artifact behaviors'
            echo "Commit: \`$DIFFEX_SOURCE_COMMIT\`"
            echo "Prepare: $PREPARE_RESULT; deterministic: $DETERMINISTIC_RESULT; live: $LIVE_RESULT"
            echo "Evidence and confirmed cleanup gate: $([[ "$failed" == 0 ]] && echo passed || echo failed)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
      - name: Retain sanitized aggregate evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daytona-summary-${{ github.sha }}-${{ github.run_attempt }}
          path: .artifacts/daytona-summary/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
